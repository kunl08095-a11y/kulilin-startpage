<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="light dark" />
<meta name="theme-color" content="#fbfbfa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#0a0a0b" media="(prefers-color-scheme: dark)" />
<title>KULILIN</title>
<link rel="icon" type="image/png" sizes="16x16" href="icons/icon16.png" />
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
<link rel="icon" type="image/png" sizes="48x48" href="icons/icon48.png" />
<link rel="icon" type="image/png" sizes="128x128" href="icons/icon128.png" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #fbfbfa;
    --fg: #16161a;
    --muted: #86868f;
    --line: rgba(20, 20, 25, .09);
    --line-strong: rgba(20, 20, 25, .18);
    --panel: rgba(255, 255, 255, .68);
    --panel-solid: #ffffff;
    --shadow: 0 1px 1px rgba(20, 20, 25, .03), 0 12px 32px -16px rgba(20, 20, 25, .18);
    --shadow-lift: 0 2px 4px rgba(20, 20, 25, .04), 0 24px 56px -22px rgba(20, 20, 25, .26);
    --ring: rgba(20, 20, 25, .05);
    --hover: rgba(20, 20, 25, .055);
    --glow: rgba(76, 110, 245, .075);
    --dock-bg: #111113;
    --handle: #111113;
    --handle-drop: 50px;
    --tile-bg: #ffffff;
    --tile-border: rgba(20, 20, 25, .07);
    --tile-hover: #f7f7f8;
    --tile-shadow: 0 10px 22px -14px rgba(20, 20, 25, .35), 0 1px 2px rgba(20, 20, 25, .05);
    --tile-fg: rgba(20, 20, 25, .7);
    --tile-strong: rgba(20, 20, 25, .32);
    --tile-letter: rgba(20, 20, 25, .55);
    --toast-bg: #111113;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a0a0b;
      --fg: #f2f2f4;
      --muted: #8b8b94;
      --line: rgba(255, 255, 255, .09);
      --line-strong: rgba(255, 255, 255, .2);
      --panel: rgba(22, 22, 25, .62);
      --panel-solid: #17171a;
      --shadow: 0 1px 1px rgba(0, 0, 0, .45), 0 16px 42px -18px rgba(0, 0, 0, .85);
      --shadow-lift: 0 2px 6px rgba(0, 0, 0, .5), 0 28px 64px -24px rgba(0, 0, 0, .95);
      --ring: rgba(255, 255, 255, .06);
      --hover: rgba(255, 255, 255, .075);
      --glow: rgba(96, 130, 255, .12);
      --dock-bg: #16161a;
      --handle: rgba(245, 245, 247, .82);
      /* 暗色下图标底不再是一块亮白，改成中性灰，压住整页的亮度 */
      --tile-bg: #9a9aa3;
      --tile-border: rgba(255, 255, 255, .12);
      --tile-hover: #a7a7b0;
      --tile-shadow: 0 10px 24px -12px rgba(0, 0, 0, .8), 0 1px 2px rgba(0, 0, 0, .35);
      --tile-strong: rgba(20, 20, 25, .38);
      --tile-fg: rgba(20, 20, 25, .62);
      --tile-letter: rgba(20, 20, 25, .6);
      --toast-bg: #232327;
    }
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    background: var(--bg);
    color: var(--fg);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* 极淡的柔光，让留白不至于太空 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(44% 36% at 50% 36%, var(--glow), transparent 72%);
  }

  ::selection { background: rgba(76, 110, 245, .18); }

  .stage {
    position: relative;
    z-index: 1;
    min-height: 100vh;
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 40px;
    padding: 40px 24px 12vh;
  }

  .brand {
    margin: 0;
    font-size: 34px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: .14em;
    text-indent: .14em;
    text-transform: uppercase;
    color: var(--fg);
    opacity: .95;
    user-select: none;
    animation: rise .5s cubic-bezier(.22, .68, .16, 1) both;
  }

  .search-area {
    position: relative;
    width: min(620px, 100%);
  }

  .search {
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
    height: 60px;
    padding: 0 6px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--panel);
    -webkit-backdrop-filter: blur(18px) saturate(170%);
    backdrop-filter: blur(18px) saturate(170%);
    box-shadow: var(--shadow);
    transition: border-color .3s ease, box-shadow .3s ease;
    /* 首帧就是完整搜索栏：只轻微上浮，不把引擎按钮和搜索按钮藏起来 */
    animation: rise-bar .5s cubic-bezier(.22, .68, .16, 1) both;
  }

  .search:focus-within,
  .search.is-open {
    border-color: var(--line-strong);
    box-shadow: var(--shadow-lift), 0 0 0 4px var(--ring);
  }

  /* ---- 搜索引擎切换 ---- */

  .engine {
    position: relative;
    flex: none;
  }

  .engine-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 44px;
    padding: 0 12px 0 15px;
    border: 0;
    border-radius: 999px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1;
    white-space: nowrap;
    cursor: pointer;
    transition: background-color .18s ease, color .18s ease;
  }

  .engine-btn:hover { background: var(--hover); color: var(--fg); }

  .engine-btn:focus-visible {
    outline: none;
    background: var(--hover);
    color: var(--fg);
    box-shadow: 0 0 0 2px var(--ring) inset;
  }

  .dot {
    flex: none;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--engine-color, var(--muted));
  }

  .chev {
    width: 11px;
    height: 11px;
    margin-left: 1px;
    opacity: .55;
    transition: transform .22s ease;
  }

  .engine-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }

  .menu {
    position: absolute;
    top: calc(100% + 12px);
    left: 0;
    z-index: 30;
    min-width: 214px;
    margin: 0;
    padding: 5px;
    list-style: none;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--panel-solid);
    box-shadow: 0 4px 12px rgba(0, 0, 0, .05), 0 26px 56px -18px rgba(0, 0, 0, .26);
    transform-origin: top left;
    animation: pop .16s cubic-bezier(.2, .7, .3, 1) both;
  }

  .menu[hidden] { display: none; }

  .menu li {
    display: flex;
    align-items: center;
    gap: 10px;
    height: 38px;
    padding: 0 10px;
    border-radius: 11px;
    color: var(--fg);
    font-size: 13.5px;
    cursor: pointer;
    outline: none;
    user-select: none;
  }

  .menu li:hover,
  .menu li:focus { background: var(--hover); }

  .menu .check {
    flex: none;
    width: 14px;
    height: 14px;
    margin-left: auto;
    opacity: 0;
    color: var(--muted);
    transition: opacity .15s ease;
  }

  .menu li[aria-selected="true"] .check { opacity: 1; }

  /* ---- 输入框 ---- */

  .q {
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    padding: 0 6px;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 16.5px;
    letter-spacing: -.005em;
  }

  .q::placeholder { color: var(--muted); opacity: .72; }

  .go {
    flex: none;
    display: grid;
    place-items: center;
    width: 48px;
    height: 48px;
    border: 0;
    border-radius: 50%;
    background: var(--fg);
    color: var(--bg);
    cursor: pointer;
    transition: transform .2s cubic-bezier(.2, .7, .3, 1), opacity .2s ease;
  }

  .go svg { width: 17px; height: 17px; }

  .go:hover { transform: scale(1.045); opacity: .92; }
  .go:active { transform: scale(.96); }

  .go:focus-visible {
    outline: 2px solid var(--fg);
    outline-offset: 3px;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }


  /* ---- 快捷网站 dock ---- */

  .dock-wrap {
    position: absolute;
    top: calc(100% + 48px);
    left: 50%;
    translate: -50% 0;
    width: 44px;          /* JS 会改成图标区的实际宽度 */
    height: 32px;
    z-index: 20;
  }

  /* 横线本体就是可见的那条线（无站点时是小圆点）。
     上边固定，点 + 时只往下长成圆角矩形，颜色过渡到输入底。 */
  .dock-handle {
    position: absolute;
    left: 50%;
    /* 与原先居中时的上边对齐，高度变化只往下长 */
    top: calc(50% - 5px);
    z-index: 2;
    width: 10px;
    height: 10px;
    translate: -50% 0;
    border-radius: 5px;
    background: var(--handle);
    transform: translateY(calc(var(--sink, 0) * var(--handle-drop, 50px)));
    transition: width .32s cubic-bezier(.22, .8, .3, 1),
                height .32s cubic-bezier(.22, .8, .3, 1),
                background-color .28s ease,
                border-radius .32s cubic-bezier(.215, .61, .355, 1),
                box-shadow .28s ease;
  }

  .dock-wrap.has-sites .dock-handle {
    top: calc(50% - 20.5px);
    width: var(--line-x, 170px);
    height: 5px;
    border-radius: 2.5px;
  }

  /* 出现/收回时横线宽度逐帧跟着图标排走，关掉宽度过渡，避免和阻尼打架 */
  .dock-wrap.revealing .dock-handle {
    transition: height .32s cubic-bezier(.22, .8, .3, 1),
                background-color .28s ease,
                border-radius .32s cubic-bezier(.215, .61, .355, 1),
                box-shadow .28s ease;
  }

  .dock-wrap.editing .dock-handle {
    z-index: 3;
    width: var(--form-w, 336px);
    height: 70px;
    background: var(--dock-bg);
    border-radius: 16px;
    box-shadow: 0 20px 44px -18px rgba(0, 0, 0, .55);
  }

  .dock-dot {
    position: absolute;
    /* 横线变薄后，仍留出一点可点区域 */
    inset: -14px 0;
    z-index: 2;
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .dock-wrap.open .dock-dot,
  .dock-wrap.editing .dock-dot {
    pointer-events: none;
  }

  .dock-dot:focus-visible {
    outline: 2px solid var(--line-strong);
    outline-offset: 2px;
    border-radius: 999px;
  }

  .dock {
    position: absolute;
    top: 50%;
    left: 50%;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 6px;
    width: max-content;
    height: 38px;
    visibility: hidden;
    pointer-events: none;
    /* 图标从横线中心长出来：位置、缩放、透明都由 JS 每帧驱动 */
    /* 整排常驻抬高 14px：图标底边不压横线，悬停/离开也不再整排浮动 */
    transform: translateX(-50%)
      translateY(calc(34px * (1 - var(--reveal, 0)) - 14px));
    transition: opacity .18s ease, visibility 0s .6s;
  }

  .dock-wrap.open .dock {
    visibility: visible;
    pointer-events: auto;
    transition: opacity .18s ease, visibility 0s;
  }

  .dock-items {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* 槽位永远保持 38px，不动布局；放大和让位全部交给 transform，
     这样每帧只合成、不重排，也不会把放大后的宽度记成“正常宽度” */
  .dock-slot,
  .dock-add {
    flex: none;
    width: 38px;
    height: 38px;
    transform-origin: center bottom;
    /* 越靠近越清晰：i 越小越先浮现，移开时反向淡出；
       transform 由 JS 逐帧写入，这里不挂过渡，避免和阻尼打架 */
    opacity: clamp(0, calc(var(--reveal, 0) * 1.45 - var(--i, 0) * .05), 1);
    will-change: transform;
  }

  .dock-slot {
    position: relative;
  }

  .dock-item {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    background-color: var(--tile-bg);
    border: 1px solid var(--tile-border);
    border-radius: 11px;
    background: var(--tile-bg);
    box-shadow: var(--tile-shadow);
    text-decoration: none;
    transform-origin: center bottom;
    transform: translateY(calc(10px * (1 - var(--reveal, 0))));
    cursor: grab;
    touch-action: none;
    -webkit-user-drag: none;
    user-select: none;
    transition: background-color .16s ease, border-color .16s ease;
  }

  .dock-item:hover { background: var(--tile-hover); }

  .dock-item img {
    position: relative;
    z-index: 1;
    width: 23px;
    height: 23px;
    border-radius: 4px;
    object-fit: contain;
    opacity: 0;
    transition: opacity .18s ease;
  }

  .dock-item img.loaded { opacity: 1; }

  .dock-letter {
    position: absolute;
    z-index: 0;
    color: var(--tile-letter);
    font-size: 15px;
    font-weight: 600;
    line-height: 1;
    text-transform: uppercase;
    transition: opacity .18s ease;
  }

  .dock-item img.loaded + .dock-letter { opacity: 0; }

  /* 拖动排序：其他图标让位，拖出 dock 则变淡 */
  .dock-slot.dragging {
    z-index: 6;
    transition: none;
  }

  .dock-slot.dragging .dock-item {
    cursor: grabbing;
    box-shadow: var(--tile-shadow), 0 18px 32px -16px rgba(0, 0, 0, .45);
  }

  .dock-slot.dragging.outside { opacity: .38; }

  .dock-items.reordering .dock-slot {
    transition: transform .18s cubic-bezier(.2, .7, .3, 1);
  }

  .dock-items.reordering .dock-slot.dragging { transition: none; }

  .dock-add {
    display: grid;
    place-items: center;
    padding: 0;
    border: 1px dashed var(--tile-strong);
    border-radius: 11px;
    background: var(--tile-bg);
    color: var(--tile-fg);
    box-shadow: var(--tile-shadow);
    cursor: pointer;
    transition: background-color .16s ease, border-color .16s ease;
  }

  .dock-add:hover {
    background: var(--tile-hover);
    border-color: rgba(20, 20, 25, .5);
    color: rgba(20, 20, 25, .9);
  }

  .dock-add svg { width: 16px; height: 16px; }

  .dock-item:focus-visible,
  .dock-add:focus-visible {
    outline: 2px solid var(--line-strong);
    outline-offset: 2px;
  }

  .dock-form {
    position: absolute;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
    padding: 6px 20px;
    max-width: calc(100vw - 32px);
    opacity: 0;
    pointer-events: none;
    /* 收回时文字先消失，避免被压进细线里 */
    transition: opacity .14s ease;
  }

  .dock-wrap.editing .dock-form {
    opacity: 1;
    pointer-events: auto;
    /* 等横线开始长厚，再淡入文字 */
    transition: opacity .22s cubic-bezier(.22, .8, .3, 1) .08s;
  }

  .dock-wrap.editing .dock {
    /* 展开输入框时图标保持可见，只是不接收点击 */
    pointer-events: none;
  }

  .dock-form.invalid { animation: shake .3s ease; }

  .dock-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .dock-input {
    flex: 1 1 auto;
    min-width: 0;
    height: 38px;
    padding: 0 10px;
    border: 0;
    outline: 0;
    background: transparent;
    color: #f4f4f6;
    font: inherit;
    font-size: 13.5px;
  }

  .dock-input::placeholder { color: rgba(255, 255, 255, .38); }

  .dock-submit {
    flex: none;
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: #f4f4f6;
    color: #111113;
    cursor: pointer;
  }

  .dock-submit svg { width: 15px; height: 15px; }

  .dock-note {
    margin: 0;
    padding: 2px 10px 3px;
    color: rgba(255, 255, 255, .42);
    font-size: 12px;
    line-height: 1.4;
  }

  .dock-note.is-error { color: rgba(255, 140, 140, .95); }

  /* ---- 撤销提示 ---- */

  .toast {
    position: fixed;
    left: 50%;
    bottom: 28px;
    z-index: 40;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: calc(100vw - 32px);
    padding: 7px 7px 7px 14px;
    border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 12px;
    background: var(--toast-bg);
    box-shadow: 0 18px 40px -18px rgba(0, 0, 0, .55);
    color: #f4f4f6;
    font-size: 13px;
    line-height: 1.2;
    opacity: 0;
    transform: translate(-50%, 8px);
    pointer-events: none;
    transition: opacity .18s ease, transform .22s cubic-bezier(.2, .7, .3, 1);
  }

  .toast[hidden] { display: none; }

  .toast.show {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }

  .toast-text {
    min-width: 0;
    overflow: hidden;
    color: rgba(255, 255, 255, .78);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .toast-action {
    flex: none;
    height: 28px;
    padding: 0 10px;
    border: 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, .12);
    color: #ffffff;
    font: inherit;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color .14s ease;
  }

  .toast-action:hover { background: rgba(255, 255, 255, .2); }

  .toast-action:focus-visible {
    outline: 2px solid rgba(255, 255, 255, .6);
    outline-offset: 2px;
  }

  @keyframes shake {
    25% { transform: translateX(calc(-50% - 4px)); }
    75% { transform: translateX(calc(-50% + 4px)); }
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  @keyframes rise-bar {
    from { transform: translateY(12px); }
    to   { transform: none; }
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(-5px) scale(.985); }
    to   { opacity: 1; transform: none; }
  }

  @media (max-width: 520px) {
    .stage { gap: 30px; padding: 40px 20px 10vh; }
    .search { height: 56px; }
    .dock-wrap { top: calc(100% + 40px); --handle-drop: 44px; }
    .dock { height: 32px; gap: 5px; }
    .dock-items { gap: 5px; }
    .dock-slot, .dock-add { width: 32px; height: 32px; }
    .dock-item { border-radius: 9px; }
    .dock-item img { width: 20px; height: 20px; }
    .dock-letter { font-size: 13px; }
    .dock-add svg { width: 13px; height: 13px; }
    .dock-wrap { --form-w: calc(100vw - 40px); }
    .dock-input { font-size: 16px; }
    .engine-btn { height: 42px; padding: 0 9px 0 12px; gap: 7px; font-size: 12.5px; }
    .q { font-size: 16px; padding: 0 2px; }
    .go { width: 44px; height: 44px; }
    .go svg { width: 16px; height: 16px; }
    .brand { font-size: 24px; letter-spacing: .18em; text-indent: .18em; }
    .toast { bottom: 18px; font-size: 12.5px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important;
      animation-delay: 0ms !important;
      transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>
  <main class="stage">
    <h1 class="brand">KULILIN</h1>

    <div class="search-area">
      <form class="search" id="searchForm" role="search" novalidate>
        <div class="engine">
          <button
            type="button"
            class="engine-btn"
            id="engineBtn"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="engineMenu"
            title="切换搜索引擎"
          >
            <span class="dot" aria-hidden="true"></span>
            <span class="engine-name">Google</span>
            <svg class="chev" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>

          <ul class="menu" id="engineMenu" role="listbox" aria-label="搜索引擎" hidden></ul>
        </div>

        <label class="sr-only" for="q">搜索</label>
        <input
          class="q"
          id="q"
          type="text"
          placeholder="搜索或输入网址…"
          autocomplete="off"
          autocapitalize="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="search"
        />

        <button type="submit" class="go" aria-label="搜索">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
            <path d="m16.5 16.5 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
      </form>

      <div class="dock-wrap" id="dockWrap">
        <div class="dock-handle" id="dockHandle">
          <button
            type="button"
            class="dock-dot"
            id="dockDot"
            aria-label="快捷网站"
            aria-expanded="false"
            aria-controls="dock"
          ></button>

          <form class="dock-form" id="dockAddForm">
            <div class="dock-row">
              <input
                class="dock-input"
                id="dockUrl"
                type="text"
                placeholder="粘贴网址…"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="网址"
              />
              <button type="submit" class="dock-submit" aria-label="添加">
                <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
                  <path d="M3 8h9M8.5 3.5 13 8l-4.5 4.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <p class="dock-note" id="dockNote" role="status">回车添加 · 右键图标可移除</p>
          </form>
        </div>

        <nav class="dock" id="dock" aria-label="快捷网站">
          <div class="dock-items" id="dockItems"></div>

          <button
            type="button"
            class="dock-add"
            id="dockAdd"
            aria-label="添加快捷网站"
            aria-expanded="false"
            title="添加快捷网站"
          >
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            </svg>
          </button>
        </nav>
      </div>
    </div>

    <p class="sr-only" id="live" role="status" aria-live="polite"></p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span class="toast-text" id="toastText"></span>
    <button type="button" class="toast-action" id="toastAction">撤销</button>
  </div>

<script src="url.js?v=20261112"></script>
<script src="app.js?v=20261112-1800"></script>
</body>
</html>
